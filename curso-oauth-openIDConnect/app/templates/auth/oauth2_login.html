<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAuth2 Login</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='login.css') }}" />
  </head>
  <body>
    <div class="container">
      <div class="login">
        <h1>Login <small class="method-tag method-oauth2">OAuth2</small></h1>
        {% if message %}
        <div class="alert alert-success">{{ message }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('oauth2_login_post') }}">
          <div>
            <label for="username">Username</label>
            <input
              type="text"
              name="username"
              id="username"
              required
              maxlength="50"
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="8"
            />
          </div>
          <button type="submit">Login</button>
        </form>
        <p class="note">
          Or use the <a href="/docs">Swagger UI</a> "Authorize" button to get a
          Bearer token.
        </p>
        <div class="meta-links">
          <a class="secondary" href="{{ url_for('oauth2_register_form') }}"
            >Create account</a
          >
          <a class="muted" href="{{ url_for('home') }}">← Back to panel</a>
        </div>
      </div>
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
    </div>
  </body>
</html>
