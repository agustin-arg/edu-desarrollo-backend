<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask Notes | Create Note</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='base.css') }}"
    />
  </head>
  <body class="page page--create-note">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__inner container">
          <a class="brand" href="{{ url_for('home.home') }}">
            <span class="brand__mark">FN</span>
            <span class="brand__text">Flask Notes</span>
          </a>
          <nav class="nav" aria-label="Primary navigation">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="{{ url_for('home.home') }}">Home</a>
              </li>
              <li class="nav__item">
                <a
                  class="nav__link nav__link--active"
                  href="{{ url_for('notes.create_note') }}"
                  >Create note</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container stack">
          <section class="page-header">
            <h1 class="page-header__title">Create a new note</h1>
            <p class="page-header__copy">
              Write your idea, choose an optional publish date, and keep your
              notebook always organized.
            </p>
          </section>

          <section class="card form-card">
            <form class="form" method="POST">
              <div class="form__group">
                <label class="form__label" for="title">Title</label>
                <input
                  class="form__control"
                  type="text"
                  name="title"
                  id="title"
                  required
                />
              </div>

              <div class="form__group">
                <label class="form__label" for="content">Content</label>
                <textarea
                  class="form__control form__control--textarea"
                  name="content"
                  id="content"
                  required
                ></textarea>
              </div>

              <div class="form__group">
                <label class="form__label" for="post">Post date</label>
                <input
                  class="form__control"
                  type="date"
                  name="post"
                  id="post"
                  value="{{ now.strftime('%Y-%m-%d') }}"
                />
                <p class="form__hint">
                  Leave this date as today if you want the note visible
                  immediately.
                </p>
              </div>

              <div class="form__actions">
                <button class="btn btn--primary" type="submit">
                  Create note
                </button>
                <a class="btn btn--ghost" href="{{ url_for('home.home') }}"
                  >Cancel</a
                >
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
